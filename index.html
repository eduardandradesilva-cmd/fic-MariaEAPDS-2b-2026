
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbie Dream World</title>
    <link rel="stylesheet" href="barbie.css">
    <script src="barbie.js" defer></script>
</head>
<body>

    <main id="jogo">

        <div class="ceu">
            <div class="nuvem nuvem1"></div>
            <div class="nuvem nuvem2"></div>
            <div class="nuvem nuvem3"></div>
        </div>

        <div class="dreamhouse"></div>

       <div id="personagem" aria-label="Personagem da Barbie"></div>

        <div id="objetosMovel">
            <div class="arbusto"></div>
            <div class="flor flor1"></div>
            <div class="flor flor2"></div>
            <div class="flor flor3"></div>
        </div>

        <div id="chao"></div>

        <div id="pontuacao">00000</div>

        <section id="cadastro" class="tela">
            <h1>Barbie Dream World</h1>
            <p>Crie seu jogador para começar a aventura!</p>

            <input
                type="text"
                id="nomeJogador"
                placeholder="Digite seu nome"
                maxlength="30"
                autocomplete="off"
            >

            <button id="botaoCriar" type="button">Criar jogador</button>

            <p id="mensagemCadastro"></p>
        </section>

        <section id="menuJogador" class="tela escondido">
            <h1>Barbie Dream World</h1>
            <h2 id="nomeSelecionado">Selecione um jogador</h2>

            <p id="dadosJogador"></p>

            <div id="listaJogadores"></div>

            <button id="botaoJogar" type="button">Jogar</button>
            <button id="botaoTrocar" type="button">Voltar ao cadastro</button>
        </section>

        <section id="gameOver" class="tela escondido">
            <h1>Fim de jogo!</h1>
            <p id="resultado"></p>

            <button id="botaoNovamente" type="button">Jogar novamente</button>
            <button id="botaoTrocarGameOver" type="button">
                Trocar jogador
            </button>
        </section>

    </main>

</body>
</html>
