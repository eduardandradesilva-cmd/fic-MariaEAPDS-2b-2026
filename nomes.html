<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Separador de Nomes</title>
    <link rel="stylesheet" href="nomes.css">
</head>

<body>

    <div class="container">

        <h1>Separador de Nomes</h1>

        <input
            type="text"
            id="nomes"
            placeholder="Ex: Maria, João, Pedro, Ana">

        <button id="btnSeparar">
             Separar Nomes
        </button>

        <p id="quantidade">
            Total de nomes: 0
        </p>

        <ul id="resultado"></ul>

    </div>

    <script src="nomes.js"></script>

</body>
</html>
